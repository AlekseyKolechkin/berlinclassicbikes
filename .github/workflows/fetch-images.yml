name: Fetch example photos

# Copies the Wikimedia Commons example photos listed in assets/img/sources.txt
# into the repository, so visitors load them from this site instead of Wikimedia.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/img/sources.txt, .github/workflows/fetch-images.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p assets/img
          grep -v '^#' assets/img/sources.txt | while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL --retry 3 \
              -A "BerlinClassicBikes/1.0 (https://berlinclassicbikes.de; kolechkinaleksei@gmail.com)" \
              "$url" -o "assets/img/$name"
            ls -l "assets/img/$name"
          done
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/*.jpg
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Add example photos from Wikimedia Commons"
            git push
          fi
